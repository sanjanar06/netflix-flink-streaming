version: '3.8'

services:
  # Zookeeper - Coordinates Kafka brokers (think of it as the "air traffic controller")
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - netflix-network

  # Kafka - The "message bus" where events travel
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      # This allows your laptop to connect to Kafka
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      # Auto-create topics when we send to them
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - netflix-network

  # Flink JobManager - The "manager" that coordinates Flink jobs
  jobmanager:
    image: flink:1.18-scala_2.12-java11
    hostname: jobmanager
    container_name: jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        state.backend: filesystem
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        heartbeat.interval: 1000
        heartbeat.timeout: 5000
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      - flink-jm-data:/tmp
    networks:
      - netflix-network

  # Flink TaskManager 1 - First "worker" - processes users that hash to this worker
  taskmanager-1:
    image: flink:1.18-scala_2.12-java11
    hostname: taskmanager-1
    container_name: taskmanager-1
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.backend: filesystem
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        taskmanager.host: taskmanager-1
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      - flink-tm1-data:/tmp
    networks:
      - netflix-network

  # Flink TaskManager 2 - Second "worker"
  taskmanager-2:
    image: flink:1.18-scala_2.12-java11
    hostname: taskmanager-2
    container_name: taskmanager-2
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.backend: filesystem
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        taskmanager.host: taskmanager-2
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      - flink-tm2-data:/tmp
    networks:
      - netflix-network

  # Flink TaskManager 3 - Third "worker"
  taskmanager-3:
    image: flink:1.18-scala_2.12-java11
    hostname: taskmanager-3
    container_name: taskmanager-3
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.backend: filesystem
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        taskmanager.host: taskmanager-3
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      - flink-tm3-data:/tmp
    networks:
      - netflix-network

  # Python Data Generator - Your "TV" that sends heartbeats
  data-generator:
    build:
      context: ./data-generator
      dockerfile: Dockerfile
    container_name: data-generator
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: viewing-events
    networks:
      - netflix-network

  # Visualization Dashboard - Shows distributed processing in real-time
  visualization:
    build:
      context: ./visualization
      dockerfile: Dockerfile
    container_name: visualization
    depends_on:
      - kafka
    ports:
      - "5001:5000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: session-metrics
    networks:
      - netflix-network

networks:
  netflix-network:
    driver: bridge

volumes:
  flink-checkpoints:
  flink-jm-data:
  flink-tm1-data:
  flink-tm2-data:
  flink-tm3-data:
